# =============================================================================
# DOCKER COMPOSE — InformesTecnicos LG Electronics
#
# Uso local con Docker (alternativa a start.bat / start.sh):
#
#   docker compose up --build       ← Primera vez o después de cambios en el código
#   docker compose up               ← Arrancar sin reconstruir
#   docker compose down             ← Detener y eliminar contenedores
#   docker compose down -v          ← Detener y eliminar contenedores + volumen de BD
#
# La app estará disponible en:
#   http://localhost:10000
#
# DIFERENCIA con start.bat:
#   start.bat    → Corre el código directamente (hot-reload, mejor para desarrollo)
#   docker compose → Corre la imagen de producción (igual a Render, bueno para testing)
# =============================================================================

services:
  app:
    # Construir la imagen desde el Dockerfile en la raíz del proyecto
    build:
      context: .
      dockerfile: Dockerfile

    container_name: informes-tecnicos

    ports:
      # Puerto local → Puerto del contenedor (nginx)
      # Accede en: http://localhost:10000
      - "10000:10000"

    environment:
      # Modo producción → carga appsettings.Production.json
      - ASPNETCORE_ENVIRONMENT=Production

      # El backend .NET escucha en el puerto 5000 internamente
      - ASPNETCORE_URLS=http://+:5000

      # ── JWT ────────────────────────────────────────────────────────────────
      # CAMBIA este valor por una clave secreta real antes de usar en producción.
      # Mínimo 32 caracteres. En Render se genera automáticamente (generateValue).
      - Jwt__Key=clave_local_docker_minimo_32_caracteres_cambiar

      - Jwt__Issuer=InformesTecnicos
      - Jwt__Audience=InformesTecnicos.Clients

      # ── Base de datos ───────────────────────────────────────────────────────
      # En Docker local, la BD se guarda en el volumen "datos" (persistente entre reinicios)
      - ConnectionStrings__Default=Data Source=/data/informes.db
      - Database__Provider=Sqlite

    volumes:
      # Volumen nombrado para persistir la BD SQLite y las fotos entre reinicios.
      # Docker crea automáticamente el volumen "informes_datos" si no existe.
      - datos:/data

    restart: unless-stopped   # Reiniciar automáticamente si el contenedor falla

# Volumen nombrado → persiste entre "docker compose down" y "docker compose up"
# Para borrar los datos: docker compose down -v
volumes:
  datos:
    name: informes_datos
