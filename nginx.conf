# =============================================================================
# NGINX CONFIG — InformesTecnicos LG Electronics
#
# Rol de nginx en producción:
#   1. Sirve los archivos estáticos del frontend React (dist/)
#   2. Hace proxy de /api/* y /uploads/* al backend .NET en el puerto 5000
#
# Así el navegador siempre habla con nginx (un solo origen), lo que evita
# problemas de CORS y simplifica el deployment en Render.
# =============================================================================

server {
    # Puerto que Render expone públicamente (el valor por defecto es 10000).
    # Si cambias el puerto en Render, actualiza también este valor.
    listen 10000;

    # ── Frontend React (archivos estáticos) ──────────────────────────────────
    location / {
        root /var/www/html;
        index index.html;

        # SPA fallback: cualquier ruta que no sea un archivo existente
        # se sirve como index.html, para que react-router funcione correctamente.
        # Sin esto, rutas como /informes/123 darían 404 al refrescar la página.
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy a la API del backend .NET ──────────────────────────────────────
    location /api/ {
        proxy_pass         http://localhost:5000/api/;
        proxy_http_version 1.1;

        # Encabezados estándar para que el backend sepa la IP real del cliente
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Limpiar el encabezado Origin antes del proxy interno.
        # Esto evita que el middleware CORS del backend rechace las peticiones,
        # ya que desde el punto de vista del navegador es una llamada mismo-origen.
        proxy_set_header Origin "";

        # Aumentar el timeout para exportaciones pesadas (Excel/PDF con fotos)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Límite de tamaño para subida de fotos (50 MB, igual al backend)
        client_max_body_size 50M;
    }

    # ── Proxy para archivos subidos (fotos de informes) ──────────────────────
    location /uploads/ {
        proxy_pass         http://localhost:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Origin "";
    }
}
